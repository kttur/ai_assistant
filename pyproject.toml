[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "Modular home AI assistant with multiple channels and model providers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
  "python-telegram-bot>=21.6,<22",
  "python-dotenv>=1.0.1,<2",
]

[project.scripts]
ai-assistant-sync-docs = "ai_assistant.devtools.sync_docs:main"

[project.optional-dependencies]
openai = ["openai>=1.55.0"]
anthropic = ["anthropic>=0.39.0"]
ollama = ["httpx>=0.27.0,<1.0.0"]
postgres = ["psycopg[binary]>=3.2.0,<4"]
dev = ["pytest>=8.3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_assistant = ["resources/i18n/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
